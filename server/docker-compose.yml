services:
  macrotally-ai:
    build: .
    env_file: .env
    ports:
      - "8787:8787"
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      # Saved brand list and the "Brands you use" pack. The host folder must be writable by uid 1001
      # (the container's "app" user): mkdir -p data && chown 1001:1001 data
      - ./data:/data
